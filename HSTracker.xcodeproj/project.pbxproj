			shellScript = "# exit 0\n\nset -x\nset -e\n\n# The BCL assemblies go into Contents/Resources/Managed, NOT into\n# Contents/Resources/Resources/Managed: HSTracker/Resources is a folder\n# reference, and Copy Bundle Resources replaces that whole directory, so\n# anything this phase writes inside it is wiped whenever that copy re-runs.\n# The wipe is invisible to the build system - it decides this phase is\n# up to date before the copy runs - so the app would launch with an empty\n# TRUSTED_PLATFORM_ASSEMBLIES and assert on corlib. Keep this in step with\n# the search path in HSTracker/Mono/MonoHelper.swift.\n\n# Version. The runtime pack lays its BCL out under lib/net<major>.<minor>, so\n# derive that directory from mono-version.txt rather than hardcoding it: a bump\n# that is not matched here stages a runtime other than the one downloaded.\nMONO_VERSION=$(cat $SRCROOT/HSTracker/mono-version.txt)\nNET_VERSION=\"net$(echo $MONO_VERSION | cut -d. -f1,2)\"\nASSEMBLIES=\"mscorlib.dll netstandard.dll System.dll System.Collections.dll System.Collections.Concurrent.dll System.Collections.Immutable.dll System.Collections.NonGeneric.dll System.Collections.Specialized.dll System.Configuration.dll System.Core.dll System.Diagnostics.TraceSource.dll System.Diagnostics.Tracing.dll System.Linq.dll System.Linq.Expressions.dll System.Memory.dll System.Numerics.Vectors.dll System.ObjectModel.dll System.Private.Uri.dll System.Private.Xml.dll System.Reflection.Emit.dll System.Reflection.Emit.ILGeneration.dll System.Reflection.Emit.Lightweight.dll System.Reflection.Metadata.dll System.Reflection.Primitives.dll System.Runtime.dll System.Runtime.CompilerServices.Unsafe.dll System.Runtime.InteropServices.dll System.Runtime.Intrinsics.dll System.Runtime.Loader.dll System.Text.Encoding.Extensions.dll System.Text.RegularExpressions.dll System.Threading.dll System.Threading.Tasks.Parallel.dll System.Threading.Thread.dll System.Threading.ThreadPool.dll System.Xml.dll System.Xml.ReaderWriter.dll System.Xml.XmlSerializer.dll\"\n\nMONO_UNIVERSAL=$SRCROOT/downloaded-frameworks/mono/universal\nLOCATION=\"${BUILT_PRODUCTS_DIR}\"/\"${FRAMEWORKS_FOLDER_PATH}\"\nBIN_LOCATION=\"${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}\"\nmkdir -p \"${LOCATION}\"\n\n# Copy needed files\ncp $MONO_UNIVERSAL/libcoreclr.dylib \"${LOCATION}\"\ncp $MONO_UNIVERSAL/libSystem.Native.dylib \"${LOCATION}\"\n\nEMBED_ARCHES=\"osx-arm64 osx-x64\"\nfor arch in $EMBED_ARCHES ; do\n    MONO_ARCH=\"arm64\"\n    if [ \"$arch\" = \"osx-x64\" ]; then\n       MONO_ARCH=\"x64\"\n    fi\n\n    # Locations\n    MONO_LOCATION=$SRCROOT/downloaded-frameworks/mono/runtimes/${arch}/lib/${NET_VERSION}\n    MONO_NATIVE=$SRCROOT/downloaded-frameworks/mono/runtimes/${arch}/native\n\n    if [ ! -d \"${MONO_LOCATION}\" ]; then\n        echo \"error: ${MONO_LOCATION} is missing - the Download Mono phase did not extract ${MONO_VERSION} for ${arch}\"\n        exit 1\n    fi\n\n    RES_LOCATION=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Managed/${MONO_ARCH}\"\n\n    mkdir -p \"${RES_LOCATION}\"\n\n    cp $MONO_NATIVE/System.Private.CoreLib.dll \"${RES_LOCATION}\"\n\n    # Copy system assemblies needed\n    for assembly in $ASSEMBLIES; do cp ${MONO_LOCATION}/$assembly \"${RES_LOCATION}\"; done\n\n    # Change runtime paths\n    #install_name_tool -change /Library/Frameworks/Mono.framework/Versions/$MONO_VERSION/lib/libmonosgen-2.0.1.dylib @rpath/libmonosgen-2.0.1.dylib \"${BIN_LOCATION}/${EXECUTABLE_NAME}\"\n    #install_name_tool -change /Library/Frameworks/Mono.framework/Versions/$MONO_VERSION/lib/libsqlite3.0.dylib @rpath/libsqlite3.0.dylib \"${BIN_LOCATION}/${EXECUTABLE_NAME}\"\ndone\n";
