excluded:
  - Carthage
  - HSTracker/Core/Extensions/LinqExtension.swift
  - HSTracker/Core/Extensions/NSData+GZIP.swift
  - HSTracker/Logging/CardIds/
  - HSTrackerUITests
  - HSTrackerTests
  - .claude/worktrees
disabled_rules:
  - cyclomatic_complexity
  - function_body_length
  - file_length
  - type_body_length
  - todo
  - identifier_name
  - function_parameter_count
  - trailing_newline
  - trailing_whitespace
  - line_length
  - comment_spacing
type_name:
  max_length:
    warning: 128
    error: 132

custom_rules:
  unchecked_allcases_index:
    name: "Unchecked allCases index"
    regex: 'allCases\[(?!safeIndex:)'
    message: "Index allCases with [safeIndex:] and supply a fallback. A raw index straight from Hearthstone traps as soon as the client knows an enum value we do not - see issue #1445, where the Black Market scene added in 36.6 crashed HSTracker on launch."
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error
